<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>域名测试站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    background: #f5f5f5; color: #333; font-size: 14px;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box {
    background: #fff; border: 1px solid #ddd; border-radius: 12px;
    padding: 40px 48px; text-align: center; max-width: 440px;
  }
  .box h1 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
  .box p { color: #666; line-height: 1.8; }
  .box .url { color: #333; font-weight: 500; }
  .ok {
    display: inline-block; margin-top: 18px; padding: 4px 14px; font-size: 12px;
    background: #2d2d2d; color: #eee; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>域名测试站</h1>
    <p>此站点（<span class="url">github.foxf.eu.cc</span>）<br>
       仅用于测试域名能否正常访问。<br>
       如果你能看到这个页面，<br>
       说明域名解析与 GitHub Pages 部署均正常。</p>
    <span class="ok">✓ 域名访问正常</span>
  </div>
</body>
</html>
